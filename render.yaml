services:
  - type: web
    name: akru-erp
    runtime: php
    plan: free
    region: singapore
    buildCommand: chmod +x ./render-build.sh && ./render-build.sh
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_NAME
        value: "AKRU"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/data/database.sqlite
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
    disk:
      name: akru-data
      mountPath: /var/data
      sizeGB: 1
